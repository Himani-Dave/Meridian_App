<title>Meridian Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#f6f5f1;
    --surface:#ffffff;
    --surface-2:#efede6;
    --ink:#15171c;
    --ink-soft:#4a4d55;
    --muted:#80828a;
    --hairline:#e2dfd6;
    --accent:#a8701b;
    --accent-ink:#ffffff;

    --cat-geo:#a33f30;
    --cat-econ:#8f6d12;
    --cat-sec:#34497a;
    --cat-mob:#1f7a62;

    --ok:#2c6f52;
    --warn:#8a6113;
    --alert:#a1442f;

    --serif:"Source Serif 4","Iowan Old Style",Georgia,serif;
    --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --ease:cubic-bezier(.22,.8,.26,1);

    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111216; --surface:#191b21; --surface-2:#20232a;
      --ink:#ecebe6; --ink-soft:#b4b3ad; --muted:#85858a; --hairline:#2a2d35;
      --accent:#e0ac52; --accent-ink:#1a1204;
      --cat-geo:#d8796a; --cat-econ:#cfa84d; --cat-sec:#8aa2d6; --cat-mob:#4fae93;
      --ok:#5aa781; --warn:#d6ac4e; --alert:#d4826f;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111216; --surface:#191b21; --surface-2:#20232a;
    --ink:#ecebe6; --ink-soft:#b4b3ad; --muted:#85858a; --hairline:#2a2d35;
    --accent:#e0ac52; --accent-ink:#1a1204;
    --cat-geo:#d8796a; --cat-econ:#cfa84d; --cat-sec:#8aa2d6; --cat-mob:#4fae93;
    --ok:#5aa781; --warn:#d6ac4e; --alert:#d4826f;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); overflow:hidden; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;}
  h1,h2{margin:0; font-family:var(--serif); text-wrap:balance; font-weight:600;}
  p{margin:0;}
  a{color:var(--ink-soft); text-underline-offset:2px;}
  button{font-family:inherit; -webkit-tap-highlight-color:transparent;}
  button:focus-visible, a:focus-visible, summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  [hidden]{display:none!important;}

  .shell{height:100%; display:flex; flex-direction:column;}
  .wrap{max-width:620px; margin-inline:auto; padding-inline:20px; width:100%;}

  .topbar{flex:0 0 auto; padding-block:12px 10px; background:var(--bg);}
  .progress{display:flex; gap:3px; height:3px;}
  .seg{flex:1; border-radius:2px; background:var(--hairline); overflow:hidden;}
  .seg i{display:block; height:100%; width:0; background:var(--ink); transition:width .45s var(--ease);}
  .seg.done i{width:100%; background:var(--muted);}
  .seg.active i{width:100%;}
  .topmeta{display:flex; justify-content:space-between; align-items:center; margin-top:12px; gap:12px;}
  .brand{font-family:var(--serif); font-weight:600; font-size:17px;}
  .counter{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; font-weight:500;}

  .track{flex:1 1 auto; min-height:0; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; overscroll-behavior-x:contain; scrollbar-width:none;}
  .track::-webkit-scrollbar{display:none;}
  .slide{flex:0 0 100%; width:100%; height:100%; scroll-snap-align:start; scroll-snap-stop:always; overflow-y:auto; overscroll-behavior-y:contain; scrollbar-width:none;}
  .slide::-webkit-scrollbar{display:none;}
  .slide .wrap{padding-block:8px 44px;}

  /* intro */
  .intro{min-height:100%; display:flex; flex-direction:column; justify-content:center; gap:24px;}
  .eyebrow{font-size:11.5px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--muted);}
  .weekday{font-family:var(--serif); font-size:clamp(40px,12vw,54px); font-weight:600; line-height:1; letter-spacing:-.015em; margin-top:10px;}
  .fulldate{font-family:var(--serif); font-size:20px; color:var(--ink-soft); margin-top:8px;}
  .summary-line{padding-block:15px; border-block:1px solid var(--hairline); font-size:15px; color:var(--ink-soft); line-height:1.5;}
  .summary-line b{color:var(--ink); font-weight:600;}
  .filter-label{font-size:11.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:10px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{font-family:var(--sans); font-size:13px; font-weight:500; padding:8px 13px; border-radius:100px; background:var(--surface); border:1px solid var(--hairline); color:var(--ink-soft); cursor:pointer;}
  .chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--bg);}
  .cat-row{display:flex; align-items:center; justify-content:space-between; padding-block:10px; border-bottom:1px solid var(--hairline); font-size:14.5px;}
  .cat-row:last-child{border-bottom:none;}
  .cat-name{display:flex; align-items:center; gap:10px; font-weight:500;}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--c); flex:0 0 auto;}
  .cat-count{color:var(--muted); font-variant-numeric:tabular-nums;}
  details.method{border-top:1px solid var(--hairline); padding-top:14px;}
  details.method summary{font-size:13.5px; font-weight:600; color:var(--ink); cursor:pointer; list-style:none;}
  details.method summary::-webkit-details-marker{display:none;}
  details.method summary::before{content:"＋ "; color:var(--muted);}
  details.method[open] summary::before{content:"− ";}
  .method-body{font-size:13.5px; line-height:1.6; color:var(--ink-soft); margin-top:12px; display:flex; flex-direction:column; gap:10px;}
  .method-body b{color:var(--ink);}

  /* story */
  .story{display:flex; flex-direction:column; gap:20px;}
  .cover{position:relative; aspect-ratio:16/9; max-width:100%; border-radius:12px; overflow:hidden; color:var(--c);
    background:
      repeating-linear-gradient(0deg, color-mix(in srgb, var(--c) 9%, transparent) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, color-mix(in srgb, var(--c) 9%, transparent) 0 1px, transparent 1px 28px),
      linear-gradient(140deg, color-mix(in srgb, var(--c) 24%, var(--surface)) 0%, color-mix(in srgb, var(--c) 6%, var(--surface)) 100%);
    display:flex; align-items:center; justify-content:center;}
  .cover svg{width:28%; height:auto; max-height:58%;}
  .kicker{font-size:11.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--c); line-height:1.5;}
  .kicker span{color:var(--muted); font-weight:600;}
  .headline{font-size:clamp(25px,6.8vw,31px); line-height:1.15; letter-spacing:-.01em; margin-top:8px;}
  .dateline{font-size:13px; color:var(--muted); margin-top:11px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .rtag{font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); background:var(--surface-2); padding:3px 7px; border-radius:5px;}

  .section{padding-top:18px; border-top:1px solid var(--hairline); display:flex; flex-direction:column; gap:12px;}
  .label{font-size:11px; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .body{font-family:var(--serif); font-size:17.5px; line-height:1.6; color:var(--ink);}
  .context-text{font-size:15px; line-height:1.55; color:var(--ink-soft);}

  .facts{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px;}
  .facts li{font-family:var(--serif); font-size:17px; line-height:1.55;}
  .tier{display:inline-flex; align-items:center; gap:4px; font-family:var(--sans); font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:2px 6px; border-radius:5px; margin-right:7px; vertical-align:2px; white-space:nowrap;}
  .tier.multi{color:var(--ok); background:color-mix(in srgb, var(--ok) 12%, transparent);}
  .tier.primary{color:var(--cat-sec); background:color-mix(in srgb, var(--cat-sec) 12%, transparent);}
  .tier.single{color:var(--warn); background:color-mix(in srgb, var(--warn) 14%, transparent);}
  .ref{font-family:var(--sans); font-size:11px; font-weight:600; text-decoration:none; color:var(--muted); vertical-align:4px; padding-inline:1px;}
  .ref:hover{color:var(--ink);}

  .disputed{background:color-mix(in srgb, var(--alert) 8%, var(--surface)); border-radius:12px; padding:18px; border:1px solid color-mix(in srgb, var(--alert) 22%, transparent);}
  .disputed .label{color:var(--alert);}
  .disputed p{font-size:15.5px; line-height:1.6; color:var(--ink); font-family:var(--serif);}
  .dlist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:11px;}
  .dlist li{font-family:var(--serif); font-size:16px; line-height:1.55;}

  .view{border-top:1px solid var(--hairline); padding-top:14px;}
  .view:first-of-type{border-top:none; padding-top:0;}
  .view-head{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin-bottom:7px;}
  .side{font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;}
  .side.left{color:#3a6ea8;} .side.centre{color:var(--muted);} .side.right{color:#a1553a;}
  :root[data-theme="dark"] .side.left{color:#87a8d8;} :root[data-theme="dark"] .side.right{color:#d09a82;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .side.left{color:#87a8d8;} :root:not([data-theme="light"]) .side.right{color:#d09a82;} }
  .outlet{font-size:12.5px; color:var(--muted);}
  .view p{font-size:16px; line-height:1.55; font-family:var(--serif);}
  .view.missing p{font-family:var(--sans); font-size:14.5px; color:var(--muted); font-style:italic;}

  .cov{background:var(--surface-2); border-radius:12px; padding:18px;}
  .cov .label{color:var(--accent);}
  .cov p{font-size:15.5px; line-height:1.6; color:var(--ink);}

  .watch-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px;}
  .watch-list li{position:relative; padding-left:22px; font-size:15.5px; line-height:1.5; color:var(--ink-soft);}
  .watch-list li::before{content:""; position:absolute; left:2px; top:.5em; width:7px; height:7px; border-radius:50%; border:1.5px solid var(--c);}

  .srclist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px; counter-reset:s;}
  .srclist li{font-size:13px; line-height:1.5; color:var(--muted); display:flex; gap:8px;}
  .snum{font-weight:700; color:var(--ink-soft); flex:0 0 auto; font-variant-numeric:tabular-nums;}
  .bias{font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft); background:var(--surface-2); padding:2px 6px; border-radius:5px; white-space:nowrap;}
  .sent-note{font-size:12.5px; color:var(--muted); font-style:italic; line-height:1.5; padding-top:16px; border-top:1px solid var(--hairline);}

  /* done */
  .done{min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:13px;}
  .ring{width:72px; height:72px; border-radius:50%; border:1.5px solid var(--hairline); display:flex; align-items:center; justify-content:center; color:var(--accent); margin-bottom:4px;}
  .ring path{stroke-dasharray:24; stroke-dashoffset:24;}
  .slide.is-current .ring path{animation:draw .6s .15s var(--ease) forwards;}
  @keyframes draw{to{stroke-dashoffset:0;}}
  .done h2{font-size:32px; letter-spacing:-.01em;}
  .done-sub{font-size:15.5px; color:var(--ink-soft); line-height:1.5; max-width:34ch;}
  .done-note{font-size:13px; color:var(--muted); max-width:34ch; line-height:1.5;}
  .ghost-btn{margin-top:12px; background:none; border:1px solid var(--hairline); color:var(--ink); padding:12px 22px; border-radius:100px; font-size:14.5px; font-weight:600; cursor:pointer;}

  /* bottom */
  .bottombar{flex:0 0 auto; border-top:1px solid var(--hairline); background:var(--bg);}
  .bottombar .wrap{display:flex; align-items:center; justify-content:space-between; padding-block:10px;}
  .btn{border:none; cursor:pointer; font-size:14.5px; font-weight:600; border-radius:100px; padding:11px 18px; display:inline-flex; align-items:center; gap:6px; transition:opacity .2s, transform .15s;}
  .btn:active{transform:scale(.97);}
  .btn-prev{background:none; color:var(--ink-soft); padding-inline:6px;}
  .btn-prev:disabled{opacity:0; pointer-events:none;}
  .btn-next{background:var(--ink); color:var(--bg); min-width:112px; justify-content:center;}
  .btn-next.is-hidden{opacity:0; pointer-events:none;}

  /* splash */
  .splash{position:fixed; inset:0; z-index:10; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; transition:opacity .55s var(--ease), transform .55s var(--ease); cursor:pointer;}
  .splash.out{opacity:0; transform:scale(1.02); pointer-events:none;}
  .mark{width:46px; height:46px; color:var(--ink);}
  .mark .meridian{stroke:var(--accent);}
  .wordmark{font-family:var(--serif); font-size:40px; font-weight:600; letter-spacing:-.01em;}
  .splash .eyebrow{letter-spacing:.2em;}
  .anim{animation:rise .8s var(--ease) both;}
  @keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  @media (prefers-reduced-motion: reduce){
    .splash,.seg i,.btn{transition:none;}
    .anim{animation:none;}
    .slide.is-current .ring path{animation:none; stroke-dashoffset:0;}
  }
</style>

<div class="splash" id="splash" role="button" aria-label="Open briefing">
  <svg class="mark anim" viewBox="0 0 48 48" fill="none" aria-hidden="true">
    <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="1.6"/>
    <ellipse class="meridian" cx="24" cy="24" rx="8" ry="20" stroke-width="1.6"/>
    <path d="M4 24h40" stroke="currentColor" stroke-width="1.2" opacity=".45"/>
  </svg>
  <div class="wordmark anim">Meridian</div>
  <div class="eyebrow anim">The world, verified</div>
</div>

<div class="shell">
  <header class="topbar">
    <div class="wrap">
      <div class="progress" id="progress"></div>
      <div class="topmeta">
        <div class="brand">Meridian</div>
        <div class="counter" id="counter"></div>
      </div>
    </div>
  </header>
  <main class="track" id="track" tabindex="0" aria-label="Briefing"></main>
  <nav class="bottombar">
    <div class="wrap">
      <button class="btn btn-prev" id="prevBtn" aria-label="Previous">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Previous
      </button>
      <button class="btn btn-next" id="nextBtn">
        <span id="nextLabel">Begin</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </nav>
</div>

<script>
(function(){
  const CATS = {
    geo:  {name:"Geopolitics & Conflict", v:"--cat-geo",  icon:iconGlobe},
    econ: {name:"Economy & Trade",        v:"--cat-econ", icon:iconChart},
    sec:  {name:"Security & Defence",     v:"--cat-sec",  icon:iconRadar},
    mob:  {name:"Migration & Mobility",   v:"--cat-mob",  icon:iconPassport}
  };
  function iconGlobe(){return `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="32" cy="32" r="24"/><ellipse cx="32" cy="32" rx="10" ry="24"/><path d="M8 32h48M12 20h40M12 44h40"/></svg>`;}
  function iconChart(){return `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 52h48M8 52V10"/><path d="M14 22l10 10 8-6 16 18"/><path d="M40 44h8v-8"/></svg>`;}
  function iconRadar(){return `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="32" cy="34" r="22"/><circle cx="32" cy="34" r="13"/><circle cx="32" cy="34" r="3" fill="currentColor" stroke="none"/><path d="M32 34L50 18"/></svg>`;}
  function iconPassport(){return `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><rect x="14" y="8" width="32" height="48" rx="4"/><circle cx="30" cy="28" r="8"/><path d="M24 44h14M22 28h16"/><path d="M48 32h10m0 0l-4-4m4 4l-4 4" stroke-linecap="round"/></svg>`;}

  const STORIES = [
    /* ---------------- 1. CANADA / TARIFFS ---------------- */
    {
      cat:"econ", sub:"Trade Policy · Canada–U.S.", regions:["Canada"],
      dateline:"Ottawa & Washington · Aug 22 – Sept 8, 2026",
      headline:"Canada's dollar-for-dollar tariffs on the U.S. took effect after trade talks collapsed",
      context:"Canada sends close to 70% of its exports to the United States. Negotiations to settle the tariff dispute broke down on Aug 21–22, and both governments escalated within days.",
      facts:[
        {t:"The U.S. imposed 50% tariffs on Canadian goods, effective just after midnight on Aug 22, 2026.", s:[0,1,2], tier:"multi"},
        {t:"Canada is matching the tariffs “dollar for dollar” from Sept 8, 2026, targeting U.S. steel, dairy, appliances, agricultural equipment, pulp and paper, and electronics.", s:[0,1,2], tier:"multi"},
        {t:"The U.S. measures cover roughly $20 billion in Canadian goods — about 5.5% of Canada's exports — including wine, furniture, dairy, cement, clothing and hockey equipment.", s:[1,0], tier:"multi"},
        {t:"Carney: “You're at war when you get attacked. We got attacked,” and Canada “will match those tariffs dollar for dollar to protect our workers and businesses.”", s:[0], tier:"single"},
        {t:"U.S. Trade Representative Jamieson Greer said Canada “declined to finalize the trade deal under the terms agreed earlier this week,” citing “new demands and walk backs,” and said the U.S. had offered “significant tariff reductions on steel, aluminum, autos and lumber.”", s:[2], tier:"single"},
        {t:"Carney says the U.S. made late changes restricting Canada's ability to strike other trade deals: “The U.S. introduced at the last hours…efforts to restrict our ability to have other trade deals.”", s:[2], tier:"single"},
        {t:"Canada relies on the U.S. for nearly 70% of its exports. The Business Roundtable warned the tariffs “risk raising costs for American businesses and families.”", s:[1], tier:"single"}
      ],
      disputed:[
        {t:"The value of Canadian goods hit. NPR and Al Jazeera both report about $20 billion; Fox Business reports approximately $28 billion. I could not confirm either against a primary U.S. document, so treat the scope as approximate."},
        {t:"Who walked away. Ottawa says Washington made last-minute demands on Canada's other trade deals; USTR says Canada added new demands and reversed agreed terms. These accounts are irreconcilable and neither side has published the text."}
      ],
      views:[
        {side:"left", label:"Left / progressive", outlet:"NPR (lean left); Al Jazeera (Qatari state-funded)", s:[0,1],
         text:"Frames Canada as the party attacked and foregrounds Carney's sovereignty language. Al Jazeera's Calgary reporting emphasises expected price rises, higher unemployment, and the risk of bankruptcies among small and medium-sized businesses."},
        {side:"centre", label:"Centre / business", outlet:"Business Roundtable, quoted in Al Jazeera", s:[1],
         text:"Treats the dispute as mutually damaging rather than a moral contest: the tariffs raise costs for American businesses and families too, and the fight is over deal terms, not principle."},
        {side:"right", label:"Right / conservative", outlet:"Fox Business (right); Pierre Poilievre via The Deep Dive", s:[2,3],
         text:"U.S. right coverage amplifies USTR's account that Ottawa moved the goalposts. Canada's Conservative leader backs the rejection — “Canada cannot accept a bad deal” — but attacks the secrecy: he wants the U.S. offer published, cost estimates for groceries and gasoline, and Parliament recalled before its Sept 21 return."}
      ],
      coverage:"American and Canadian outlets report nearly identical facts and assign blame in opposite directions. Note that the Canadian opposition's criticism is about transparency, not about retaliating — on the tariff response itself, Canada's two main parties broadly agree, which is unusual and easy to miss if you only read U.S. coverage.",
      watch:[
        "Whether Parliament is recalled before Sept 21, or the tariffs run without a parliamentary vote.",
        "Whether either government publishes the rejected deal text — the only thing that would settle the competing accounts.",
        "Whether the $20bn vs $28bn discrepancy is resolved by an official U.S. tariff schedule."
      ],
      sources:[
        {n:"NPR", b:"Lean left", t:"As Canada readies retaliatory tariffs, Mark Carney says his nation is 'at war' with U.S.", u:"https://www.npr.org/2026/08/22/nx-s1-5941584/us-canada-tariffs"},
        {n:"Al Jazeera", b:"Qatari state-funded", t:"Canada to hit US with retaliatory tariffs as trade war escalates", u:"https://www.aljazeera.com/news/2026/8/23/canada-to-hit-us-with-retaliatory-tariffs-as-trade-war-escalates"},
        {n:"Fox Business", b:"Right", t:"Canada's Carney says US made last-minute 'power play' as trade talks collapse", u:"https://www.foxbusiness.com/politics/canadas-carney-us-last-minute-power-play-trade-talks-collapse-retaliatory-tariffs"},
        {n:"The Deep Dive", b:"Canadian business press", t:"Poilievre backs Carney rejection but calls out secrecy on rejected US trade deal", u:"https://thedeepdive.ca/poilievre-carney-rejected-us-trade-deal/"}
      ]
    },

    /* ---------------- 2. INDIA–CANADA ---------------- */
    {
      cat:"geo", sub:"Bilateral Relations · India–Canada", regions:["Canada","India"],
      dateline:"New Delhi & Ottawa · May–Sept 2026",
      headline:"India and Canada aim to close a trade deal by year-end, while Canada's spy agency names India a foreign-interference actor",
      context:"Both governments describe a reset underway since June 2025 after a period of severe strain. The trade track and the security track are advancing at the same time, in opposite emotional directions.",
      facts:[
        {t:"At Foreign Office Consultations in New Delhi on Sept 2, 2026, India's Secretary (East) Rudrendra Tandon and Canada's Deputy Minister of Foreign Affairs Arun Thangaraj led delegations. Both sides committed to finalising a Comprehensive Economic Partnership Agreement by year-end and to more than doubling bilateral trade to CAD 70 billion by 2030.", s:[0], tier:"primary"},

        {n:"CBC", b:"Canadian public broadcaster", t:"UN rights chief says uncovered remains in Gaza raise concerns of war crimes (headline only — article would not load)", u:"https://www.cbc.ca/news/world/united-nations-bodies-recovered-gaza-9.7344274"}
      ]
    },

    /* ---------------- 8. TAIWAN ---------------- */
    {
      cat:"sec", sub:"Indo-Pacific · Taiwan Strait", regions:["Global"],
      dateline:"Taipei · Aug 20 – Sept 13, 2026",
      headline:"Taiwan approved a record defence budget — while its own military says a PLA invasion capability is years away",
      context:"Chinese military activity around Taiwan has been rising for years, but the two most decision-relevant facts this month point in different directions: spending is up sharply, and Taiwan's own assessment of PLA readiness is more measured than most foreign coverage suggests.",
      facts:[
        {t:"Taiwan's cabinet approved a 2027 defence budget of NT$1.12 trillion (about US$35 billion) on Aug 20, 2026 — an 18.2% increase, NT$173 billion more than the current year, and 28.6% of total proposed expenditure of NT$3.93 trillion. It prioritises weapons, ammunition and operations, including U.S. systems such as HIMARS.", s:[0], tier:"single"},
        {t:"In the 24 hours to 6 a.m. on Sept 13, 2026, Taiwan's Ministry of National Defense detected five PLA aircraft sorties, five PLAN ships and two official ships; three of the five sorties entered Taiwan's southwestern and eastern air defence identification zone.", s:[1], tier:"primary"},
        {t:"Taiwan's MND report on PLA capabilities finds the PLA developing “water-bridge” amphibious landing vessels, upgrading helicopters and transport for island operations, and investing in low-Earth-orbit satellite communications (Guowang, Qianfan), fourth-generation BeiDou navigation, AI deepfake and electronic warfare tools, and battlefield medical evacuation for casualties outside mainland China.", s:[2], tier:"single"},
        {t:"The same MND report states that current PLA capabilities for such operations “remain inadequate at this stage,” and analyst Chieh Chung estimated the programmes could be completed in stages between 2030 and 2035.", s:[2], tier:"single"},
        {t:"PLA air activity around Taiwan is running at roughly half of 2025's pace, while naval presence has not declined.", s:[3], tier:"single"}
      ],
      disputed:[
        {t:"The budget figure. SCMP reports NT$1.12 trillion / US$35 billion, matching the Aug 20 cabinet approval. The Daily Caller reported NT$1 trillion / about US$31 billion. SCMP's figure is more precise and better dated; an earlier version of this briefing used the lower number."},
        {t:"What the drills mean. The Hudson Institute's Patrick Cronin, quoted in right-leaning U.S. coverage, reads the pattern as rehearsal for a rapid shift to blockade or invasion. Taiwan's own defence ministry says current capability is inadequate and puts programme completion in 2030–2035. Both statements can be true — rehearsing a capability you do not yet have is normal — but the emphasis produces very different impressions of urgency."},
        {t:"The halved air activity figure comes from a single outlet's reading of detection data. I could not verify it against MND's own annual totals."}
      ],
      views:[
        {side:"right", label:"Right / hawkish", outlet:"The Daily Caller (right), quoting Hudson Institute", s:[3],
         text:"The PLA is “rehearsing the ability to transition rapidly from peacetime coercion or a military exercise to a blockade or full-scale invasion.” Encirclement by military and nominally civilian vessels is read as the core threat signal."},
        {side:"centre", label:"Centre / Taiwan official", outlet:"Taiwan Ministry of National Defense (primary); Taipei Times", s:[1,2],
         text:"Pressure is real and preparations are accelerating, but capability “remains inadequate at this stage” with a 2030–2035 horizon. This is the government with the most at stake being more measured than foreign commentary about it."},
        {side:"left", label:"Pro-Beijing lean", outlet:"South China Morning Post (Hong Kong, Alibaba-owned)", s:[0],
         text:"Frames the budget as a response both to Beijing's pressure and to “repeated calls from Washington for Taipei to spend more on its own defence” — locating U.S. pressure as a driver alongside Chinese activity, which Western coverage tends to omit."}
      ],
      coverage:"The single most decision-relevant fact — Taiwan's own military saying PLA invasion capability is currently inadequate, with a 2030–2035 horizon — appeared in Taiwanese coverage of the MND report and not in the U.S. coverage I read, which led with rehearsal-for-invasion framing. Note also that the left/right labels map poorly here: the meaningful axis is proximity to Beijing, Taipei or Washington, not left and right.",
      watch:[
        "Whether Taiwan's legislature passes the NT$1.12tn budget, and at what final figure — a cabinet proposal is not an appropriation.",
        "Whether naval presence keeps rising while air sorties fall.",
        "Whether MND's “inadequate capability” assessment changes in its next report."
      ],
      sources:[
        {n:"SCMP", b:"Hong Kong, Alibaba-owned", t:"Taiwan proposes record US$35b defence budget for 2027 as PLA's pressure grows", u:"https://www.scmp.com/news/china/military/article/3364713/taiwan-proposes-record-us35b-defence-budget-2027-plas-pressure-grows"},
        {n:"Taiwan MND", b:"Primary — Taiwan govt", t:"PLA activities in the waters and airspace around Taiwan, Sept 13, 2026", u:"https://www.globalsecurity.org/wmd/library/news/taiwan/2026/taiwan-260913-roc-mnd01.htm"},
        {n:"Taipei Times", b:"Taiwan, pro-sovereignty", t:"MND report flags PLA efforts to boost Taiwan landing capabilities", u:"https://www.taipeitimes.com/News/taiwan/archives/2026/09/02/2003863545"},
        {n:"The Daily Caller", b:"Right", t:"Things Are Heating Up In The Taiwan Strait", u:"https://dailycaller.com/2026/09/14/taiwan-strait-china-drills-heating-up/"}
      ]
    }
  ];

  const REGIONS = ["All","Canada","India","Europe","Global"];
  const $ = id => document.getElementById(id);
  const track = $("track");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let filter = "All";
  let list = STORIES.slice();
  let cur = 0;

  function applyFilter(){
    list = filter === "All" ? STORIES.slice() : STORIES.filter(s => s.regions.includes(filter));
  }
  function catCounts(arr){ return arr.reduce((m,s)=>(m[s.cat]=(m[s.cat]||0)+1,m),{}); }

  function introSlide(){
    const now = new Date();
    const weekday = now.toLocaleDateString(undefined,{weekday:"long"});
    const date = now.toLocaleDateString(undefined,{month:"long", day:"numeric", year:"numeric"});
    const counts = catCounts(list);
    const rows = Object.entries(counts).map(([k,n])=>`
      <div class="cat-row" style="--c:var(${CATS[k].v})">
        <span class="cat-name"><span class="dot"></span>${CATS[k].name}</span>
        <span class="cat-count">${n}</span>
      </div>`).join("");
    const chips = REGIONS.map(r=>{
      const n = r==="All" ? STORIES.length : STORIES.filter(s=>s.regions.includes(r)).length;
      return `<button class="chip" data-region="${r}" aria-pressed="${r===filter}">${r} · ${n}</button>`;
    }).join("");
    return `
      <section class="slide"><div class="wrap intro">
        <div>
          <div class="eyebrow">Today's briefing</div>
          <div class="weekday">${weekday}</div>
          <div class="fulldate">${date}</div>
        </div>
        <p class="summary-line"><b>${list.length} ${list.length===1?"story":"stories"}</b> · every fact source-linked · left, centre and right views marked separately</p>
        <div>
          <div class="filter-label">Filter by region</div>
          <div class="chips" id="regionChips">${chips}</div>
        </div>
        <div>${rows}</div>
        <details class="method">
          <summary>How to read this briefing</summary>
          <div class="method-body">
            <p><b>Facts</b> carry a tag showing how well they are corroborated: <b>2+ sources</b> means at least two independent outlets reported it, <b>primary</b> means it comes from the document or institution itself, and <b>1 source</b> means a single outlet said it and nothing here confirms it. Numbers after each fact link to the source.</p>
            <p><b>Disputed</b> collects places where sources conflict, where a figure is unconfirmed, or where I tried to retrieve something and failed. Corrections to earlier versions of this briefing appear here too.</p>
            <p><b>Views</b> are labelled left, centre and right, each tied to a named outlet. Where a side genuinely was not found in the research, it is marked <b>not sourced</b> rather than invented. On some stories the left–right axis does not apply, and the card says so instead of forcing it.</p>
            <p><b>Bias labels</b> next to each source are broad, widely-used characterisations, not measurements — and they describe the outlet, not whether a given fact is true. State-funded, corporate-owned and industry sources are labelled as such because the interest matters as much as the ideology.</p>
            <p><b>What is missing:</b> public sentiment is not connected. Earlier versions showed sentiment readings that I had invented; those were removed.</p>
          </div>
        </details>
      </div></section>`;
  }

  function factList(s){
    return s.facts.map(f=>{
      const tierText = f.tier==="multi" ? (f.s.length+" sources") : f.tier==="primary" ? "Primary" : "1 source";
      const refs = f.s.map(i=>`<a class="ref" href="${s.sources[i].u}" target="_blank" rel="noopener" title="${s.sources[i].n}">[${i+1}]</a>`).join("");
      return `<li><span class="tier ${f.tier}">${tierText}</span>${f.t}${refs}</li>`;
    }).join("");
  }

  function storySlide(s){
    const c = CATS[s.cat];
    const tags = s.regions.map(r=>`<span class="rtag">${r}</span>`).join("");
    const views = s.views.map(v=>`
      <div class="view ${v.missing?"missing":""}">
        <div class="view-head">
          <span class="side ${v.side}">${v.label}</span>
          <span class="outlet">${v.outlet}</span>
        </div>
        <p>${v.text}</p>
      </div>`).join("");
    const srcs = s.sources.map((x,i)=>`
      <li><span class="snum">${i+1}</span><span><a href="${x.u}" target="_blank" rel="noopener">${x.n}</a> <span class="bias">${x.b}</span><br>${x.t}</span></li>`).join("");
    return `
      <section class="slide" style="--c:var(${c.v})"><div class="wrap story">
        <div class="cover" role="img" aria-label="${c.name}">${c.icon()}</div>
        <div>
          <div class="kicker">${c.name} <span>›</span> <span>${s.sub}</span></div>
          <h1 class="headline">${s.headline}</h1>
          <div class="dateline">${tags}<span>${s.dateline}</span></div>
        </div>
        ${s.context?`<div class="section"><div class="label">Context</div><p class="context-text">${s.context}</p></div>`:""}
        <div class="section">
          <div class="label">Verified facts</div>
          <ul class="facts">${factList(s)}</ul>
        </div>
        <div class="section" style="border-top:none; padding-top:0;">
          <div class="disputed">
            <div class="label">Disputed or unverified</div>
            <ul class="dlist">${s.disputed.map(d=>`<li>${d.t}</li>`).join("")}</ul>
          </div>
        </div>
        <div class="section">
          <div class="label">Three views, marked</div>
          ${views}
        </div>
        <div class="section" style="border-top:none; padding-top:0;">
          <div class="cov">
            <div class="label">Bias &amp; coverage notes</div>
            <p>${s.coverage}</p>
          </div>
        </div>
        <div class="section">
          <div class="label">What to watch</div>
          <ul class="watch-list">${s.watch.map(w=>`<li>${w}</li>`).join("")}</ul>
        </div>
        <div class="section">
          <div class="label">Sources</div>
          <ul class="srclist">${srcs}</ul>
        </div>
        <p class="sent-note">Public sentiment: not connected. Reddit data is not wired in yet, and the placeholder readings shown in earlier versions were invented, so they were removed rather than left in place.</p>
      </div></section>`;
  }

  function doneSlide(){
    const n = list.length;
    const cats = Object.keys(catCounts(list)).length;
    return `
      <section class="slide"><div class="wrap done">
        <div class="ring"><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M5 12.5L9.5 17L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <h2>You're caught up</h2>
        <p class="done-sub">${n} ${n===1?"story":"stories"} across ${cats} ${cats===1?"category":"categories"}${filter!=="All"?`, filtered to ${filter}`:""}.</p>
        <p class="done-note">Every fact above links to its source. Where sources conflicted or could not be reached, the card says so rather than smoothing it over.</p>
        <button class="ghost-btn" id="againBtn">Back to the start</button>
      </div></section>`;
  }

  let segs = [];
  function render(){
    applyFilter();
    track.innerHTML = introSlide() + list.map(storySlide).join("") + doneSlide();
    $("progress").innerHTML = list.map(()=>'<div class="seg"><i></i></div>').join("");
    segs = [...$("progress").children];
    cur = 0;
    track.scrollTo({left:0, behavior:"auto"});
    update();
  }

  function total(){ return list.length + 2; }

  function update(){
    const story = cur - 1;
    const last = total() - 1;
    segs.forEach((s,k)=>{
      s.classList.toggle("done", cur === last ? true : k < story);
      s.classList.toggle("active", k === story);
    });
    $("counter").textContent = (cur>=1 && cur<=list.length) ? `${cur} of ${list.length}` : (cur===0 ? "" : "Done");
    $("prevBtn").disabled = cur === 0;
    $("nextLabel").textContent = cur === 0 ? "Begin" : (cur === list.length ? "Finish" : "Next");
    $("nextBtn").classList.toggle("is-hidden", cur === last);
    [...track.children].forEach((el,k)=>el.classList.toggle("is-current", k===cur));
  }

  function go(i){
    i = Math.max(0, Math.min(total()-1, i));
    track.scrollTo({left: i * track.clientWidth, behavior: reduce ? "auto" : "smooth"});
  }

  let ticking = false;
  track.addEventListener("scroll", ()=>{
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(()=>{
      const i = Math.round(track.scrollLeft / track.clientWidth);
      if(i !== cur){ cur = i; update(); }
      ticking = false;
    });
  }, {passive:true});

  window.addEventListener("resize", ()=>{ track.scrollTo({left: cur * track.clientWidth, behavior:"auto"}); });

  $("prevBtn").addEventListener("click", ()=>go(cur-1));
  $("nextBtn").addEventListener("click", ()=>go(cur+1));

  document.addEventListener("click", e=>{
    const chip = e.target.closest("[data-region]");
    if(chip){ filter = chip.dataset.region; render(); return; }
    if(e.target.closest("#againBtn")) go(0);
  });

  document.addEventListener("keydown", e=>{
    if(e.target.closest("details") || e.target.tagName === "SUMMARY") return;
    if(e.key === "ArrowRight"){ e.preventDefault(); go(cur+1); }
    if(e.key === "ArrowLeft"){ e.preventDefault(); go(cur-1); }
  });

  render();

  const splash = $("splash");
  function closeSplash(){
    if(splash.classList.contains("out")) return;
    splash.classList.add("out");
    setTimeout(()=>{ splash.hidden = true; }, reduce ? 0 : 600);
  }
  splash.addEventListener("click", closeSplash);
  setTimeout(closeSplash, 1800);
})();
</script>
