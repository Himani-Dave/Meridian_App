# Meridian — one workflow, both jobs.
#
# Combined into a single file so it can be pasted into GitHub's web editor in
# one go. Same behaviour as the two-file version.
#
# Ingest fires at 11:00 and 12:00 UTC and the gate drops whichever is not 07:00
# in Toronto, so the run time survives the daylight-saving change.

name: Meridian

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        type: choice
        options: [validate, ingest, diagnose]
        default: validate
  schedule:
    - cron: "0 13 * * 1"   # weekly feed check, Mondays
    - cron: "0 11 * * *"   # 07:00 EDT
    - cron: "0 12 * * *"   # 07:00 EST

permissions:
  contents: write

concurrency:
  group: meridian

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.p.outputs.mode }}
    steps:
      - id: p
        run: |
          EVENT="${{ github.event_name }}"
          SCHED="${{ github.event.schedule }}"
          CTX="${{ inputs.job }}"
          RAW="${{ github.event.inputs.job }}"
          echo "event=$EVENT schedule='$SCHED' inputs.job='$CTX' event.inputs.job='$RAW'"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Both spellings, then a default. An empty input must never mean
            # "do nothing quietly" — that is how a green check hides a no-op.
            MODE="${CTX:-${RAW:-validate}}"
          elif [ "$SCHED" = "0 13 * * 1" ]; then
            MODE=validate
          else
            # Which of the two daily twins is 07:00 in Toronto TODAY?
            #
            # This used to ask `TZ=America/Toronto date +%H` = 07, which is the
            # time the runner STARTED, not the time the cron was due. GitHub
            # delays scheduled runs under load, and the cost was total: between
            # 18 Sep and 1 Oct 2026, 26 daily runs fired and every one resolved
            # to skip — 26 green checks on runs that did nothing, and no daily
            # briefing for two weeks. Meridian #6 fired from a daily cron and
            # started at 14:47 UTC; by then the Toronto hour read 10.
            #
            # The two Monday runs in that window (#16, #31) worked fine, because
            # the branch above matches the cron string exactly instead of asking
            # the clock. That contrast is the whole bug.
            #
            # So decide from WHICH cron entry fired, which is exact, and from
            # today's UTC offset, which is what daylight saving actually moves.
            OFFSET="$(TZ=America/Toronto date +%z)"     # -0400 EDT | -0500 EST
            case "$OFFSET" in
              -0400) WANT="0 11 * * *" ;;              # 11:00 UTC = 07:00 EDT
              -0500) WANT="0 12 * * *" ;;              # 12:00 UTC = 07:00 EST
              *)     echo "::error::unexpected Toronto offset '$OFFSET'"; exit 1 ;;
            esac
            if [ "$SCHED" = "$WANT" ]; then MODE=ingest; else MODE=skip; fi
            echo "offset=$OFFSET wanted='$WANT' fired='$SCHED'"
          fi

          case "$MODE" in
            validate|ingest|diagnose|skip) ;;
            *) echo "::error::gate resolved mode to '$MODE', which is not a job"; exit 1 ;;
          esac

          echo "resolved mode=$MODE"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

  run:
    needs: gate
    if: needs.gate.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - run: npm ci
        working-directory: backend

      # PREFLIGHT, first and on its own. It checks config and cross-module
      # consistency — a search endpoint in the roster, a candidate list keyed to
      # nothing, validation using a different HTTP client from ingestion. Those
      # are what actually broke this project, and none of them is catchable by
      # testing a function in isolation. A failure here stops the run.
      - name: Preflight
        run: node --test test/integrity.test.js
        working-directory: backend

      # Behavioural tests. Shipping data from a build where these fail is worse
      # than not running at all.
      - name: Tests
        run: node --test test/*.test.js
        working-directory: backend

      - name: Validate feeds
        if: needs.gate.outputs.mode == 'validate'
        continue-on-error: true      # a starved lean bucket must still leave its report
        id: validate
        run: node scripts/validate-feeds.js --discover --write

      - name: Ingest
        if: needs.gate.outputs.mode == 'ingest'
        continue-on-error: true
        id: ingest
        working-directory: backend
        run: node run.js

      # Read-only: probes the unverified feeds under several User-Agents and
      # writes config/feed-diagnosis.md. No continue-on-error — if the
      # diagnostic itself breaks, that should be loud.
      - name: Diagnose feeds
        if: needs.gate.outputs.mode == 'diagnose'
        id: diagnose
        run: node scripts/diagnose-feeds.js

      - name: Summary
        if: always()
        run: |
          echo "----- feed report (also in the job summary) -----"
          [ -f config/feed-report.md ] && cat config/feed-report.md || echo "(no feed report)"
          echo "------------------------------------------------"
          {
            echo "## Meridian — ${{ needs.gate.outputs.mode }}"
            echo
            [ -f config/feed-report.md ] && tail -n +2 config/feed-report.md
            [ -f backend/data/run-report.json ] && {
              echo '```json'
              node -e 'const r=require("./backend/data/run-report.json");console.log(JSON.stringify({counts:r.counts,balance:r.balance,starved:r.starvedSides,failures:r.failures.length},null,1))'
              echo '```'
              echo "<details><summary>Retrieval failures</summary>"
              node -e 'for(const f of require("./backend/data/run-report.json").failures)console.log("- "+f.source+": "+f.reason)'
              echo "</details>"
            }
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # Committed so the 08:00 composition session can read them over
      # raw.githubusercontent.com, and so each run leaves an auditable trail.
      - name: Commit results
        if: always()
        run: |
          git config user.name meridian-bot
          git config user.email meridian-bot@users.noreply.github.com
          mkdir -p backend/data

          # Stage each path on its own. `git add a b c` fails ATOMICALLY if any
          # pathspec matches nothing and stages none of them — that one line
          # silently threw away the results of three runs.
          for p in config/sources.json config/feed-report.md config/feed-diagnosis.md backend/data; do
            if [ -e "$p" ]; then
              git add -A "$p"
              echo "staged $p"
            else
              echo "absent, skipping: $p"
            fi
          done
          git status --short

          if git diff --staged --quiet; then
            echo "::error::A '${{ needs.gate.outputs.mode }}' run produced nothing to commit. Results did not reach the repo."
            exit 1
          fi
          git commit -m "${{ needs.gate.outputs.mode }}: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      # A run that skipped both jobs must not report success. Silent no-ops are
      # the failure mode this project is built to make impossible.
      - name: Refuse to pass a run that did nothing
        if: always()
        run: |
          if [ "${{ steps.validate.conclusion }}" = "skipped" ] \
             && [ "${{ steps.ingest.conclusion }}" = "skipped" ] \
             && [ "${{ steps.diagnose.conclusion }}" = "skipped" ]; then
            echo "::error::Neither job ran. gate resolved mode='${{ needs.gate.outputs.mode }}'."
            exit 1
          fi

      - name: Fail if the run reported a problem
        if: steps.validate.outcome == 'failure' || steps.ingest.outcome == 'failure'
        run: |
          echo "Read the summary before publishing this run."
          exit 1
